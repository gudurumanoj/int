[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-recsys-demo"
version = "0.1.0"
description = "Minimal LLM-assisted recommendation service demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
